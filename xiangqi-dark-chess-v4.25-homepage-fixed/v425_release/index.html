<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>棋局 · 象棋／暗棋 AI 棋局實驗室 v4.25</title>
<link rel="stylesheet" href="./src/index.css">
<script>
  window.addEventListener('error', function (event) {
    const root = document.getElementById('root');
    if (!root) return;
    if (event && event.error) console.error(event.error);
    const msg = event && event.message ? event.message : '網頁程式載入失敗';
    const location = event && event.filename ? `\n來源：${event.filename}\n行：${event.lineno || '-'}　欄：${event.colno || '-'}` : '';
    root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#07101f;color:#ebe1cd;font-family:system-ui,sans-serif"><div style="width:min(820px,100%);border:1px solid rgba(219,178,100,.22);border-radius:16px;padding:28px;background:#0e1828"><h1>遊戲載入失敗</h1><pre style="white-space:pre-wrap;padding:16px;border-radius:12px;background:#07101f;color:#f2d39b">'+(String(msg)+location).replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]);})+'</pre></div></div>';
  });
  window.addEventListener('unhandledrejection', function (event) {
    console.error(event.reason);
  });
</script>
<!-- 使用 UMD 版本，讓整個網頁只使用同一份 React / ReactDOM，避免 Hooks／useRef 衝突。 -->
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#07101f;color:#ebe1cd;font-family:system-ui,sans-serif">
    <div style="text-align:center"><h1 style="margin:0 0 8px">棋局載入中…</h1><p style="color:#aeb7c7">正在啟動遊戲引擎</p></div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
